name: Project MVP CI/CD Deploy

# ── 트리거 설정 ─────────────────────────────────────
# main 브랜치에 push될 때 자동 실행
on:
  push:
    branches:
      - main
  workflow_dispatch: # GitHub UI에서 수동 실행 버튼

jobs:
  # ════════════════════════════════════════════════
  # BE 품질 게이트
  # ════════════════════════════════════════════════
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. Java 25 환경 설정
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: apps/backend-repo/*.gradle*

      - name: 3. 백엔드 테스트
        working-directory: apps/backend-repo
        run: |
          chmod +x gradlew
          ./gradlew clean test

  # ════════════════════════════════════════════════
  # FE 품질 게이트
  # ════════════════════════════════════════════════
  frontend-quality:
    name: Frontend Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2-1. pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 2-2. Node.js v24 + pnpm 캐시 설정
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: 3. 의존성 설치
        working-directory: apps/frontend-repo
        run: pnpm install --frozen-lockfile

      - name: 4. 프론트엔드 테스트
        working-directory: apps/frontend-repo
        run: pnpm test

      - name: 5. 프론트엔드 린트
        working-directory: apps/frontend-repo
        run: pnpm lint

  # ════════════════════════════════════════════════
  # BE 배포 job
  # ════════════════════════════════════════════════
  backend-deploy:
    name: Backend Deploy
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      # ── Step 1: 코드 가져오기 ───────────────────────
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      # ── Step 2: Java 25 환경 설정 ───────────────────
      - name: 2. Java 25 환경 설정
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      # ── Step 3: Gradle 빌드 ─────────────────────────
      # chmod +x gradlew: gradlew 파일 실행 권한 부여
      # clean bootJar: 품질 게이트 통과 후 배포용 JAR 생성
      - name: 3. Gradle 권한 부여 및 빌드
        working-directory: apps/backend-repo
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      # ── Step 4: JAR + 스크립트를 서버로 전송 ─────────
      # source: 전송할 파일 경로
      #   build/libs/*-SNAPSHOT.jar → Gradle 빌드 결과 JAR
      #   scripts/deploy.sh         → 배포 스크립트
      # target: 서버의 임시 저장 경로 /opt/deploy_stage
      # strip_components: 2 → 경로에서 앞 2단계 폴더 제거
      #   (build/libs/xxx.jar → xxx.jar 로 전송)
      - name: 4-1. JAR 파일을 서버로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_KEY }}
          source: "apps/backend-repo/build/libs/*-SNAPSHOT.jar"
          target: "/opt/deploy_stage"
          strip_components: 4
          # apps/backend-repo/build/libs/xxx.jar

      - name: 4-2. 배포 스크립트를 서버로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_KEY }}
          source: "apps/backend-repo/scripts/deploy.sh"
          target: "/opt/deploy_stage"
          strip_components: 3
          # apps/backend-repo/scripts/deploy.sh

      # ── Step 5: 서버 접속 후 배포 스크립트 실행 ──────
      - name: 5. 서버 접속 후 배포 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export BEDROCK_ENABLED="${{ secrets.BEDROCK_ENABLED }}"
            export BEDROCK_REGION="${{ secrets.BEDROCK_REGION }}"
            export BEDROCK_MODEL_ID="${{ secrets.BEDROCK_MODEL_ID }}"
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"

            # JAR 파일명을 build.jar로 통일
            # (Gradle 빌드 결과물은 버전명이 붙어 파일명이 매번 달라짐)
            mv /opt/deploy_stage/*.jar /opt/deploy_stage/build.jar

            # Windows에서 작성된 스크립트의 줄바꿈 문자 변환
            # Windows: \r\n  →  Linux: \n
            # 이 처리 없으면 "command not found" 에러 발생
            sed -i "s/\r$//" /opt/deploy_stage/deploy.sh

            # 배포 스크립트 실행 권한 부여 및 실행
            chmod +x /opt/deploy_stage/deploy.sh
            /opt/deploy_stage/deploy.sh

      # ── Step 6: Slack 알림 ──────────────────────────
      # if: always() → 성공/실패 무관하게 항상 실행
      - name: 6. Slack 배포 결과 알림
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "배포 결과: ${{ job.status }}",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    { "title": "레포", "value": "${{ github.repository }}", "short": true },
                    { "title": "브랜치", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "커밋", "value": "${{ github.sha }}", "short": false },
                    { "title": "작업자", "value": "${{ github.actor }}", "short": true }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ════════════════════════════════════════════════
  # FE 배포 job
  # ════════════════════════════════════════════════
  frontend-deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    needs: frontend-quality

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2-1. pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 2-2. Node.js v24 + pnpm 캐시 설정
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: 3. 의존성 설치
        working-directory: apps/frontend-repo
        run: pnpm install --frozen-lockfile

      - name: 4. Vite 프로젝트 빌드
        working-directory: apps/frontend-repo
        run: pnpm run build
        # 빌드 결과물: apps/frontend-repo/dist/

      - name: 5. AWS 인증 구성
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2 # 서울 리전.

      - name: 6. S3 버킷에 빌드 결과물 업로드
        run: |
          aws s3 sync apps/frontend-repo/dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: 7. Slack 배포 결과 알림
        if: always() # 성공/실패 무관하게 항상 실행
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "[Frontend] 배포 결과: ${{ job.status }}",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    { "title": "레포",   "value": "${{ github.repository }}", "short": true },
                    { "title": "브랜치", "value": "${{ github.ref_name }}",   "short": true },
                    { "title": "커밋",   "value": "${{ github.sha }}",        "short": false },
                    { "title": "작업자", "value": "${{ github.actor }}",      "short": true }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
