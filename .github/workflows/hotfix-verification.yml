name: Excel Upload Hotfix Verification
on:
  push:
    branches: [hotfix/excel-upload-save]
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
          cache-dependency-path: apps/backend-repo/*.gradle*
      - name: Backend regression tests
        working-directory: apps/backend-repo
        run: |
          if ! bash gradlew test; then
            cat build/test-results/test/TEST-cop.kbds.agilemvp.transaction.controller.TransactionUploadContractTest.xml
            exit 1
          fi
