spring:
  application:
    name: agilemvp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=MONTH,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/migration_dev

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    database-id: h2

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5level [%X{traceId}] --- [%-15.15thread] %-40.40logger{39} : %msg%n"
  level:
    root: INFO
    cop.kbds.agilemvp: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: ASC
    operations-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
feature:
  toggle:
    sample:
      hidden-endpoint: false
    transaction:
      reset: true

bedrock:
  enabled: ${BEDROCK_ENABLED:false}
  region: ${BEDROCK_REGION:ap-northeast-2}
  model-id: ${BEDROCK_MODEL_ID:}
  max-tokens: ${BEDROCK_MAX_TOKENS:1200}
  temperature: ${BEDROCK_TEMPERATURE:0.2}
  api-call-timeout: ${BEDROCK_API_CALL_TIMEOUT:30s}
