spring:
  application:
    name: demo
  profiles:
    active: local

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.demo.domain
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:demo-secret-key-must-be-at-least-32-bytes-long-for-hmac}
